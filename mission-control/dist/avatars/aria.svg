<svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="shine" cx="35%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="40" height="40" rx="10" fill="url(#bg)"/>
  <rect width="40" height="40" rx="10" fill="url(#shine)"/>

  <!-- Shoulders / body -->
  <ellipse cx="20" cy="42" rx="11" ry="7" fill="#4c1d95"/>

  <!-- Neck -->
  <rect x="17.5" y="26" width="5" height="5" rx="1" fill="#fcd3a0"/>

  <!-- Face -->
  <ellipse cx="20" cy="18" rx="9.5" ry="10.5" fill="#fcd3a0"/>

  <!-- Hair — top and sides -->
  <ellipse cx="20" cy="9" rx="9.5" ry="5.5" fill="#5b21b6"/>
  <ellipse cx="11" cy="17" rx="3.5" ry="7" fill="#5b21b6"/>
  <ellipse cx="29" cy="17" rx="3.5" ry="7" fill="#5b21b6"/>
  <!-- Hair overlap to clean up -->
  <ellipse cx="20" cy="18" rx="9.5" ry="10.5" fill="#fcd3a0"/>
  <!-- Hair top re-draw over face edges -->
  <path d="M10.5 14 Q10.5 7 20 7 Q29.5 7 29.5 14 L28 12 Q24 8.5 20 9 Q16 8.5 12 12 Z" fill="#5b21b6"/>

  <!-- Eyes -->
  <ellipse cx="16.5" cy="18" rx="1.8" ry="2.1" fill="#1e1b4b"/>
  <ellipse cx="23.5" cy="18" rx="1.8" ry="2.1" fill="#1e1b4b"/>
  <!-- Eye shine -->
  <circle cx="17.2" cy="17.1" r="0.65" fill="white" opacity="0.9"/>
  <circle cx="24.2" cy="17.1" r="0.65" fill="white" opacity="0.9"/>

  <!-- Smile -->
  <path d="M16.5 23 Q20 26.5 23.5 23" stroke="#c27a68" stroke-width="1.3" fill="none" stroke-linecap="round"/>

  <!-- Subtle glow dot top right — "2B spark" -->
  <circle cx="30" cy="9" r="1.8" fill="#c4b5fd" opacity="0.7"/>
  <circle cx="30" cy="9" r="0.9" fill="white" opacity="0.9"/>
</svg>
